[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent-hub-backend"
version = "0.1.0"
description = "M0 backend foundation for Enterprise AI Agent Hub"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.1",
  "asyncpg==0.30.0",
  "fastapi==0.115.12",
  "pydantic-settings==2.9.1",
  "sqlalchemy[asyncio]==2.0.41",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
