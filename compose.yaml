name: enterprise-ai-agent-hub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_agent_hub}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-enterprise_ai_agent_hub}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Enterprise AI Agent Hub}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-0.5.0}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://app:app@db:5432/enterprise_ai_agent_hub}
      CHECKPOINT_DATABASE_URL: ${COMPOSE_CHECKPOINT_DATABASE_URL:-postgresql://app:app@db:5432/enterprise_ai_agent_hub}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-change-me-before-deployment}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      RUN_DB_TESTS: ${RUN_DB_TESTS:-true}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-20}
      REMOTE_EMBEDDING_BASE_URL: ${REMOTE_EMBEDDING_BASE_URL:-}
      REMOTE_EMBEDDING_API_KEY: ${REMOTE_EMBEDDING_API_KEY:-}
      REMOTE_EMBEDDING_MODEL: ${REMOTE_EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-20}
      KNOWLEDGE_UPLOAD_DIR: /data/uploads
      KNOWLEDGE_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_FILE_BYTES:-20971520}
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-700}
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-100}
      KNOWLEDGE_MAX_UPLOAD_FILES: ${KNOWLEDGE_MAX_UPLOAD_FILES:-10}
      CHROMA_PATH: /data/chroma
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-enterprise_ai_knowledge}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.12}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-5}
      TOOL_MAX_RESULT_ITEMS: ${TOOL_MAX_RESULT_ITEMS:-50}
    volumes:
      - knowledge_uploads:/data/uploads
      - chroma_data:/data/chroma
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  knowledge_uploads:
  chroma_data:
